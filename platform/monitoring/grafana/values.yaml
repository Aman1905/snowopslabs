# Grafana Helm Chart Values
# https://github.com/grafana/helm-charts/tree/main/charts/grafana

# Admin credentials
adminUser: admin
# adminPassword is set via --set flag in install.sh for security

# Grafana image
image:
  repository: grafana/grafana
  # Pinned, not "latest": a floating tag means a pod restart can silently change
  # the Grafana version underneath a running lab.
  tag: "13.2.1"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Persistence (for homelab, use smaller volumes)
persistence:
  type: pvc
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi

initChownData:
  enabled: false

# Datasources provisioning (correct format for Grafana Helm chart)
# Only Prometheus: every lab has it. Loki and Tempo come and go with the
# logging and tracing providers, which apply their datasource as a ConfigMap
# for the datasource sidecar below. Listing them here made Grafana show two
# failing datasources on every lab without those providers.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true

# Dashboards provisioning
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: grafana-dashboards

# The dashboard sidecar watches for ConfigMaps labelled grafana_dashboard="1" and loads them live.
# The datasource sidecar does the same for grafana_datasource="1" in Grafana's
# own namespace and reloads provisioning, so a provider's datasource appears
# when its ConfigMap is applied and goes when it is deleted (the provider's
# file sets prune: true), with no Grafana restart.
sidecar:
  datasources:
    enabled: true
    label: grafana_datasource
    labelValue: "1"
    resource: configmap
    env:
      # The dashboard sidecar already listens on the default 8080 in this pod.
      HEALTH_PORT: "8081"
    # The reload call needs Grafana's admin login. The chart passes the user only
    # when env below does not set GF_SECURITY_ADMIN_USER, which it does, so
    # without this the reload is refused and a new datasource waits for a
    # restart. The chart still passes the password.
    envValueFrom:
      REQ_USERNAME:
        secretKeyRef:
          name: '{{ include "grafana.fullname" . }}'
          key: admin-user
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# Dashboard downloads disabled - dashboards ship as local JSON via the ConfigMap.
dashboards: {}

# Grafana plugins
plugins: []

# Grafana environment variables
env:
  GF_SECURITY_ADMIN_USER: admin
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_USERS_ALLOW_SIGN_UP: "false"
  # Grafana 13 ships Loki, Tempo and the other core datasources as bundled
  # plugins and, by default, re-installs them into the image's plugins-bundled
  # directory at startup. The chart runs Grafana with a read-only root
  # filesystem, so that install fails and Loki and Tempo never load: every
  # query through those datasources answers "Unable to find datasource plugin".
  # The image already holds them, so skip the install and keep the filesystem
  # read-only.
  GF_PLUGINS_PREINSTALL_DISABLED: "true"

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Ingress configuration (Traefik)
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  path: /
  pathType: Prefix
  hosts:
    - grafana.snowops.localhost

# RBAC
rbac:
  create: true
  pspEnabled: false

# Service Account
serviceAccount:
  create: true
  autoMount: true
  name: grafana

# Pod annotations for Prometheus scraping
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"
